<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Response</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell detail-shell response-only-shell">
      <nav class="page-nav" aria-label="Page navigation">
        <a class="secondary-link nav-link" href="/">Home</a>
      </nav>

      <section class="hero compact-hero">
        <div>
          <p class="eyebrow">AI Response</p>
          <h1 id="title">Stock Response</h1>
          <p id="subtitle" class="lede"></p>
        </div>
        <div class="hero-stat">
          <span>Score</span>
          <strong id="scoreValue">--</strong>
          <small id="tickerLabel"></small>
        </div>
      </section>

      <section class="toolbar detail-toolbar" aria-label="Response controls">
        <a id="backLink" class="secondary-link" href="/run.html">Back to ranking</a>
      </section>

      <p id="status" class="status" role="status"></p>

      <nav class="result-view-tabs" role="tablist" aria-label="Response content">
        <button
          id="responseTab"
          class="result-view-tab is-active"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="responsePanel"
          data-response-view="response"
        >AI Response</button>
        <button
          id="reasoningTab"
          class="result-view-tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="reasoningPanel"
          data-response-view="reasoning"
          tabindex="-1"
        >Reasoning Trace</button>
      </nav>

      <section class="response-view-stack">
        <article
          id="responsePanel"
          class="detail-panel response-only-panel response-view-panel"
          role="tabpanel"
          aria-labelledby="responseTab"
          data-response-panel="response"
        >
          <div class="panel-heading">
            <h2>AI Response</h2>
            <span id="finishReason"></span>
          </div>
          <div class="text-block response-only-text" id="responseContent">--</div>
          <p id="responseError" class="error-cell"></p>
        </article>

        <article
          id="reasoningPanel"
          class="detail-panel response-only-panel response-view-panel"
          role="tabpanel"
          aria-labelledby="reasoningTab"
          data-response-panel="reasoning"
          hidden
        >
          <div class="panel-heading">
            <h2>Reasoning Trace</h2>
            <span id="reasoningStats"></span>
          </div>
          <div class="text-block response-only-text" id="reasoningContent">--</div>
        </article>
      </section>
    </main>
    <script src="/response.js" type="module"></script>
  </body>
</html>
