<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock Score Ranking</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell run-shell">
      <nav class="page-nav" aria-label="Page navigation">
        <button class="secondary-button nav-link" type="button" data-home-button>Home</button>
      </nav>

      <section class="hero compact-hero">
        <div>
          <p class="eyebrow">Saved Ranking</p>
          <h1 id="runTitle">Stock Score Ranking</h1>
          <p id="runPrompt" class="lede"></p>
        </div>
        <div class="hero-stat">
          <span id="runStatus">Loading...</span>
          <strong id="runCount">0</strong>
          <small>results</small>
        </div>
      </section>

      <section class="toolbar result-toolbar" aria-label="Ranking controls">
        <button id="editRunButton" class="secondary-button" type="button">Edit Run</button>
        <button id="copyRunButton" class="secondary-button" type="button">Copy Run</button>
        <button id="extendButton" class="secondary-button" type="button">Extend</button>
        <button id="fillButton" class="secondary-button" type="button">Fill Missing</button>
        <button id="stopButton" class="danger-button" type="button">Stop</button>
        <button id="deleteButton" class="danger-button" type="button">Archive</button>
        <button id="rerunButton" type="button">Rerun</button>
      </section>

      <section id="runEditor" class="prompt-editor run-editor" hidden aria-label="Edit run">
        <label>
          <span>Run name</span>
          <input id="runEditorName" type="text" maxlength="120" />
        </label>
        <label>
          <span>Prompt</span>
          <textarea id="runEditorPrompt" rows="8"></textarea>
        </label>
        <label>
          <span>Response token limit</span>
          <input id="runEditorMaxTokens" type="number" min="1" max="32768" step="1" />
        </label>
        <div class="actions">
          <button id="saveRunButton" type="button">Save changes</button>
          <button id="cancelRunEditButton" class="secondary-button" type="button">Cancel</button>
        </div>
      </section>

      <p id="status" class="status" role="status"></p>

      <section class="metric-grid run-metric-grid" aria-label="Run summary">
        <article class="metric-card">
          <span>Model</span>
          <strong id="statModel">--</strong>
        </article>
        <article class="metric-card">
          <span>Progress</span>
          <strong id="statProgress">--</strong>
        </article>
        <article class="metric-card">
          <span>Queued / Scoring</span>
          <strong id="statQueueCount">--</strong>
        </article>
        <article class="metric-card">
          <span>ETA</span>
          <strong id="statEta">--</strong>
        </article>
        <article class="metric-card">
          <span>Cost</span>
          <strong id="statCost">--</strong>
        </article>
        <article class="metric-card">
          <span>Total Tokens</span>
          <strong id="statTokens">--</strong>
        </article>
        <article class="metric-card">
          <span>Response Token Limit</span>
          <strong id="statTokenLimit">--</strong>
        </article>
        <article class="metric-card">
          <span>Avg Response Tokens</span>
          <strong id="statAverageResponseTokens">--</strong>
        </article>
        <article class="metric-card">
          <span>Avg Reasoning Tokens</span>
          <strong id="statAverageReasoningTokens">--</strong>
        </article>
        <article class="metric-card">
          <span>Avg Latency</span>
          <strong id="statLatency">--</strong>
        </article>
        <article class="metric-card">
          <span>Score Range</span>
          <strong id="statScoreRange">--</strong>
        </article>
        <article class="metric-card">
          <span>Average Score</span>
          <strong id="statAverageScore">--</strong>
        </article>
        <article class="metric-card">
          <span>Requests</span>
          <strong id="statRequests">--</strong>
        </article>
      </section>

      <nav class="result-view-tabs" role="tablist" aria-label="Run results">
        <button
          id="rankingTab"
          class="result-view-tab is-active"
          type="button"
          role="tab"
          aria-selected="true"
          data-result-view="ranking"
        >Ranking <span id="rankingTabCount">0</span></button>
        <button
          id="failedTab"
          class="result-view-tab"
          type="button"
          role="tab"
          aria-selected="false"
          data-result-view="failed"
          tabindex="-1"
        >Failed <span id="failedTabCount">0</span></button>
      </nav>

      <section id="failedActions" class="failed-actions" hidden aria-label="Failed response actions">
        <button id="redriveFailedButton" class="secondary-button" type="button">Redrive All</button>
      </section>

      <section id="scoreFilterToolbar" class="filter-toolbar" aria-label="Score filters">
        <label>
          <span>Search ranking</span>
          <input id="rankingSearchInput" type="search" placeholder="Company or ticker" autocomplete="off" />
        </label>
        <label>
          <span>Find score</span>
          <input id="scoreTargetInput" type="number" min="0" max="100" step="1" placeholder="87" />
        </label>
        <div class="score-stepper" aria-label="Move between score buckets">
          <button id="scoreDownButton" class="secondary-button icon-button" type="button" title="Previous lower score">Down</button>
          <button id="scoreUpButton" class="secondary-button icon-button" type="button" title="Next higher score">Up</button>
        </div>
        <button id="clearScoreFilterButton" class="secondary-button" type="button">Clear filter</button>
        <p id="filterStatus" class="filter-status">Showing all scores.</p>
      </section>

      <section id="resultsTableWrap" class="table-wrap" aria-label="Successful stock score ranking">
        <table class="ranking-table ranking-view">
          <thead>
            <tr>
              <th aria-sort="ascending">
                <button class="sort-button" type="button" data-sort-key="scoreRank">Rank</button>
              </th>
              <th>
                <button class="sort-button" type="button" data-sort-key="score">Score</button>
              </th>
              <th>
                <button class="sort-button" type="button" data-sort-key="company">Company</button>
              </th>
              <th>
                <button class="sort-button" type="button" data-sort-key="inputTokens">Input</button>
              </th>
              <th>
                <button class="sort-button" type="button" data-sort-key="responseTokens">Response</button>
              </th>
              <th>
                <button class="sort-button" type="button" data-sort-key="reasoningTokens">Reasoning</button>
              </th>
              <th>
                <button class="sort-button" type="button" data-sort-key="tokenBudgetPercent">Budget Used</button>
              </th>
              <th>
                <button class="sort-button" type="button" data-sort-key="durationMs">Time</button>
              </th>
              <th>
                <button class="sort-button" type="button" data-sort-key="cost">Cost</button>
              </th>
              <th>
                <button class="sort-button" type="button" data-sort-key="error">Error</button>
              </th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="resultRows"></tbody>
        </table>
      </section>
    </main>
    <script src="/run.js" type="module"></script>
  </body>
</html>
