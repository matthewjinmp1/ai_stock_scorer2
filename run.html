<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock Score Ranking</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <nav class="page-nav" aria-label="Page navigation">
        <a class="secondary-link nav-link" href="/">Home</a>
      </nav>

      <section class="hero compact-hero">
        <div>
          <p class="eyebrow">Saved Ranking</p>
          <h1 id="runTitle">Stock Score Ranking</h1>
          <p id="runPrompt" class="lede"></p>
        </div>
        <div class="hero-stat">
          <span id="runStatus">Loading...</span>
          <strong id="runCount">0</strong>
          <small>results</small>
        </div>
      </section>

      <section class="toolbar result-toolbar" aria-label="Ranking controls">
        <label class="search">
          <span>Saved runs</span>
          <select id="runSelect"></select>
        </label>
        <button id="renameButton" class="secondary-button" type="button">Rename</button>
        <button id="editPromptButton" class="secondary-button" type="button">Edit Prompt</button>
        <button id="stopButton" class="danger-button" type="button">Stop</button>
        <button id="deleteButton" class="danger-button" type="button">Archive</button>
        <button id="rerunButton" type="button">Rerun</button>
      </section>

      <section id="promptEditor" class="prompt-editor" hidden aria-label="Edit scoring prompt">
        <label>
          <span>Saved prompt</span>
          <textarea id="promptEditorInput" rows="8"></textarea>
        </label>
        <div class="actions">
          <button id="savePromptButton" type="button">Save prompt</button>
          <button id="cancelPromptButton" class="secondary-button" type="button">Cancel</button>
        </div>
      </section>

      <p id="status" class="status" role="status"></p>

      <section class="table-wrap" aria-label="Stock score ranking">
        <table>
          <thead>
            <tr>
              <th>Score Rank</th>
              <th>Score</th>
              <th>Company</th>
              <th>Market Cap Rank</th>
              <th>Market Cap</th>
              <th>Country</th>
              <th>Error</th>
            </tr>
          </thead>
          <tbody id="resultRows"></tbody>
        </table>
      </section>
    </main>
    <script src="/run.js" type="module"></script>
  </body>
</html>
