<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reasoning Trace</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell detail-shell response-only-shell">
      <nav class="page-nav" aria-label="Page navigation">
        <a class="secondary-link nav-link" href="/">Home</a>
      </nav>

      <section class="hero compact-hero">
        <div>
          <p class="eyebrow">Reasoning Trace</p>
          <h1 id="title">Stock Reasoning</h1>
          <p id="subtitle" class="lede"></p>
        </div>
        <div class="hero-stat">
          <span>Reasoning</span>
          <strong id="reasoningTokens">--</strong>
          <small>tokens</small>
        </div>
      </section>

      <section class="toolbar detail-toolbar multi-action-toolbar" aria-label="Reasoning controls">
        <a id="responseLink" class="secondary-link" href="/response.html">Back to response</a>
        <a id="backLink" class="secondary-link" href="/run.html">Back to ranking</a>
      </section>

      <p id="status" class="status" role="status"></p>

      <article class="detail-panel response-only-panel">
        <div class="panel-heading">
          <h2>Reasoning Trace</h2>
          <span id="reasoningStats"></span>
        </div>
        <div class="text-block response-only-text" id="reasoningContent">--</div>
      </article>
    </main>
    <script src="/reasoning.js" type="module"></script>
  </body>
</html>
